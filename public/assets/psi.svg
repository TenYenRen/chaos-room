<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Multi-spectrum Neon Gradients -->
    <linearGradient id="psiCyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <linearGradient id="goldAccGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Futuristic Hologram Glow -->
    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Radiant Core -->
  <circle cx="100" cy="100" r="85" fill="url(#coreGlow)" />

  <!-- Outer Astrolabe / Calibration Rings -->
  <circle cx="100" cy="100" r="92" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="14 8 4 8" opacity="0.4" />
  <circle cx="100" cy="100" r="86" stroke="#9333ea" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />
  <circle cx="100" cy="100" r="80" stroke="url(#psiCyberGrad)" stroke-width="2" opacity="0.75" />

  <!-- Precision Cardinal Coordinate Marks -->
  <line x1="100" y1="4" x2="100" y2="12" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="100" y1="188" x2="100" y2="196" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="4" y1="100" x2="12" y2="100" stroke="#ff007a" stroke-width="2.5" stroke-linecap="round" />
  <line x1="188" y1="100" x2="196" y2="100" stroke="#ff007a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Hexagonal Sacred Geometry Matrix -->
  <polygon points="100,24 166,62 166,138 100,176 34,138 34,62" stroke="#00f3ff" stroke-width="1" stroke-dasharray="6 6" fill="none" opacity="0.2" />

  <!-- The Psychology Psi Emblem (Ψ) Master Geometry -->
  
  <!-- Outer Aura Duplicate for Depth -->
  <path d="M 46 56 C 46 136, 154 136, 154 56" stroke="#00f3ff" stroke-width="10" stroke-linecap="round" opacity="0.15" filter="url(#hyperGlow)" />
  <line x1="100" y1="26" x2="100" y2="174" stroke="#00f3ff" stroke-width="10" stroke-linecap="round" opacity="0.15" filter="url(#hyperGlow)" />

  <!-- Primary Curved Arms of the Psi (Ψ) -->
  <path d="M 46 56 C 46 134, 154 134, 154 56" stroke="url(#psiCyberGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" filter="url(#hyperGlow)" />

  <!-- Inner Concentric Arm Accent -->
  <path d="M 58 64 C 58 122, 142 122, 142 64" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Central Shaft (Spire of Consciousness) -->
  <line x1="100" y1="26" x2="100" y2="174" stroke="url(#psiCyberGrad)" stroke-width="7" stroke-linecap="round" filter="url(#hyperGlow)" />
  <line x1="100" y1="32" x2="100" y2="168" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- Base Pedestal & Crown Terminal Caps -->
  <line x1="78" y1="174" x2="122" y2="174" stroke="url(#psiCyberGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="84" y1="174" x2="116" y2="174" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <line x1="86" y1="26" x2="114" y2="26" stroke="url(#psiCyberGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Left and Right Arm Crown Finials -->
  <circle cx="46" cy="56" r="6" fill="#00f3ff" filter="url(#hyperGlow)" />
  <circle cx="46" cy="56" r="2.5" fill="#ffffff" />

  <circle cx="154" cy="56" r="6" fill="#ff007a" filter="url(#hyperGlow)" />
  <circle cx="154" cy="56" r="2.5" fill="#ffffff" />

  <!-- Central Spire Tip Crystal -->
  <circle cx="100" cy="26" r="5" fill="#00f3ff" filter="url(#hyperGlow)" />
  <circle cx="100" cy="26" r="2" fill="#ffffff" />

  <!-- Psychic Origin Gem (Core Junction) -->
  <circle cx="100" cy="116" r="8" fill="#131a26" stroke="url(#goldAccGrad)" stroke-width="2" filter="url(#subtleGlow)" />
  <circle cx="100" cy="116" r="4" fill="url(#goldAccGrad)" />

  <!-- Sub-satellite Orbital Nodes -->
  <circle cx="73" cy="86" r="2" fill="#00f3ff" opacity="0.8" />
  <circle cx="127" cy="86" r="2" fill="#ff007a" opacity="0.8" />
</svg>
